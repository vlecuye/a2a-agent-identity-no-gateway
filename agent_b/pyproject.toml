[project]
name = "agent-b"
version = "0.1.0"
description = "Specialist calculation agent in ADK exposed via A2A with Agent Identity"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.156.0,<2.0.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-genai>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "aiohttp>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
